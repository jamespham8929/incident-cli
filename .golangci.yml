# Pinned lint configuration so local runs and CI agree on the enabled set.
# Run with the same version the CI workflow pins (golangci-lint v1.62.2).
run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
    - misspell
    - unconvert
