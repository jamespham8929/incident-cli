# Pinned lint configuration so local runs and CI agree on the enabled set.
# Run with the same version the CI workflow pins (golangci-lint v2.15.0).
# gosimple is part of staticcheck in v2, and gofmt and goimports are formatters.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
